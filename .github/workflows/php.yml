name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, tokenizer, xml
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Pin Laravel version
        run: >
          composer require --dev --no-interaction --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run test suite
        run: composer run-script test

  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, tokenizer, xml
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: composer run-script lint:test

      - name: Check refactorings
        run: composer run-script refactor:test
